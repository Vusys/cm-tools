name: Release

on:
  release:
    types: [published]
  # Dry run: build and smoke-test the phar without publishing anything, so the
  # release path can be exercised before a tag depends on it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build phar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: box
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --no-dev --optimize-autoloader

      - run: box compile

      - run: |
          cp builds/cm-tools.phar cm-tools
          chmod +x cm-tools

      # Guards against shipping a phar that builds but can't run — a broken stub
      # or a file missing from box.json only shows up when it's executed.
      - name: Smoke-test the phar
        run: |
          set -euo pipefail
          ./cm-tools --version
          printf 'alpha *beta* gamma delta\n' | ./cm-tools wrap --width=20
          printf 'plain text\n' | ./cm-tools lint --dialect=jira-cloud

      - name: Attach the phar to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: cm-tools

      # A workflow_dispatch run has no release to attach to, so keep the phar as
      # a downloadable artifact instead.
      - name: Upload the phar as a build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cm-tools-phar
          path: cm-tools
          if-no-files-found: error
