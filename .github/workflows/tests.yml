name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        include:
          - php: '8.5'
            coverage: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16 # v2.31.1
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}

      - uses: ramsey/composer-install@3.1.1

      - run: composer test -- --coverage-clover=coverage.xml
        if: ${{ matrix.coverage }}

      - run: composer test
        if: ${{ !matrix.coverage }}

      - uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2 # v5.4.2
        if: ${{ matrix.coverage }}
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  static-analysis:
    name: Larastan · Pint · Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16 # v2.31.1
        with:
          php-version: '8.4'

      - uses: ramsey/composer-install@3.1.1

      - run: composer check

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: reviewdog/action-actionlint@f207bb54948da53c4a3fe5f65e5cd6d0f28a825e # v1.65.2
        with:
          fail_level: error

  gate:
    name: CI gate
    if: always()
    needs: [test, static-analysis, actionlint]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
